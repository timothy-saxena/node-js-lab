<html>
    <head>
        <title>Weather App</title>
    </head>

    <body>
        <h1>Weather App</h1>

        <input type="text" id="city" placeholder="Enter City" />
        <button onclick="getWeather()">Get Weather</button>

        <h3 id="result"></h3>

        <script>
            const API_KEY = "4cac606c2a87c0b26481cdb2f3a46648";

            async function getWeather() {
                let city = document.getElementById("city").value;

                let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`;

                let response = await fetch(url);
                let data = await response.json();

/*                 document.getElementById("result").innerHTML = `
                City : ${data.name}<br>
                Temperature : ${data.main.temp} °C<br>
                Humidity : ${data.main.humidity}%<br>
                Weather : ${data.weather[0].description}
                `;
 */
                document.getElementById("result").innerHTML = `

    <br><b>City:</b> ${data.name}
    <br><b>Country:</b> ${data.sys.country}

    <br><b>Temperature:</b> ${data.main.temp}°C
    <br><b>Feels Like:</b> ${data.main.feels_like}°C
    <br><b>Min Temp:</b> ${data.main.temp_min}°C
    <br><b>Max Temp:</b> ${data.main.temp_max}°C

    <br><b>Humidity:</b> ${data.main.humidity}%
    <br><b>Pressure:</b> ${data.main.pressure} hPa

    <br><b>Wind Speed:</b> ${data.wind.speed} m/s
    <br><b>Cloud Cover:</b> ${data.clouds.all}%

    <br><b>Visibility:</b> ${data.visibility / 1000} km

    <br><b>Sunrise:</b> ${new Date(data.sys.sunrise * 1000).toLocaleTimeString()}
    <br><b>Sunset:</b> ${new Date(data.sys.sunset * 1000).toLocaleTimeString()}

    <br><b>Weather:</b> ${data.weather[0].description}
`;


            }
        </script>
    </body>
</html>
